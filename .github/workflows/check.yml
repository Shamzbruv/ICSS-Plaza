name: Application checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: plaza-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PLAZA_TEST_DATABASE_URL: postgresql://postgres:plaza-ci-only@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - name: Prepare and test Postgres
        run: |
          psql "$PLAZA_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE ROLE anon; CREATE ROLE authenticated; CREATE ROLE service_role;'
          psql "$PLAZA_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261113141000_icss_plaza_backend.sql
          psql "$PLAZA_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261113162000_vendor_trust.sql
          node --test test/platform.test.js test/postgres-cutover.test.js
